server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # PostgREST — mirrors Supabase's /rest/v1/* path, strip the prefix PostgREST doesn't expect
  location /rest/v1/ {
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass http://postgrest:3000;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
  }

  # GoTrue shim + AI functions — our Deno API handles both path prefixes directly
  location /auth/v1/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }

  location /functions/v1/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
